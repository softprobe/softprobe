name: Build and Push TheLake Docker Image

# Softprobe convention (match otel/backend/sp-agent-java):
# Create a GitHub Release with tag vX.Y.Z → this workflow builds and pushes the image.
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  # Production Deployment pulls Artifact Registry (see deployment-k8s gcp/production/sp-llm).
  AR_REGISTRY: us-central1-docker.pkg.dev
  AR_IMAGE: us-central1-docker.pkg.dev/cs-poc-sasxbttlzroculpau4u6e2l/softprobe/splake

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet

          echo "Building ${AR_IMAGE}:${IMAGE_TAG} (linux/amd64)"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t "${AR_IMAGE}:${IMAGE_TAG}" \
            -t "${AR_IMAGE}:latest" \
            .

          echo "Pushed ${AR_IMAGE}:${IMAGE_TAG} and ${AR_IMAGE}:latest"
