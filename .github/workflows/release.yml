name: Build and Push TheLake Docker Image

# Softprobe convention (match otel/backend/sp-agent-java):
# Create a GitHub Release with tag vX.Y.Z → this workflow runs `make publish-docker`
# (same entry point as local/emergency publishes).
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  # Production Deployment pulls Artifact Registry (see deployment-k8s gcp/production/sp-llm).
  AR_REGISTRY: us-central1-docker.pkg.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # build.sh creates/reuses docker-container builder `thelake-builder` for
        # registry cache; leave the action's default builder unnamed to avoid
        # bootstrap races on a shared name.

      - name: Build and push docker image
        run: |
          set -euo pipefail
          # Auth covers both product tags and BuildKit registry cache (:buildcache).
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet
          # Prereleases must not move the mutable :latest tag.
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            make publish-docker TAG="${IMAGE_TAG}" TAG_LATEST=0
          else
            make publish-docker TAG="${IMAGE_TAG}"
          fi
