name: Build and Push TheLake Docker Image

# Softprobe convention: GitHub Release vX.Y.Z → make release
# (ci-full + test-perf + build-release + publish-docker; Docker never compiles).
# Warm self-hosted SLO: ≤ 25m (hard timeout 35m).
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  AR_REGISTRY: us-central1-docker.pkg.dev
  CI: "true"
  ENFORCE_SLO: "1"
  PERF_TARGET_MS: "1000"

jobs:
  release:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep curl clang mold

      - name: Doctor
        run: make doctor-ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start local test infra
        run: make setup-local

      - name: Release gate (ci-full + test-perf + build-release + publish)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            make release TAG="${IMAGE_TAG}" TAG_LATEST=0
          else
            make release TAG="${IMAGE_TAG}"
          fi

      - name: Teardown local infra
        if: always()
        run: make teardown-local
