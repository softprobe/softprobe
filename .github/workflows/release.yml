name: Build and Push TheLake Docker Image

# Softprobe convention: GitHub Release vX.Y.Z → make release
# (ci + test-perf + build-release + publish; Docker never compiles).
# Warm self-hosted SLO: ≤ 25m (hard timeout 35m).
# Cache: ~/.cache/thelake via Make — no actions/cache for target/.
on:
  release:
    types: [published]

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  AR_REGISTRY: us-central1-docker.pkg.dev
  CI: "true"
  CARGO_INCREMENTAL: "0"
  ENFORCE_SLO: "1"
  PERF_TARGET_MS: "1000"

jobs:
  release:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35

    steps:
      # Must stay inline and before checkout: root-owned warehouse/ blocks actions/checkout.
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - uses: actions/checkout@v5

      # Skip dtolnay/rust-toolchain: arc-runner already has rustc/cargo/rustfmt/clippy
      # (and mold/clang). make doctor fails fast if anything is missing.
      - name: Doctor
        run: make doctor

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start local test infra
        run: make setup

      - name: Release gate (ci + test-perf + build-release + publish)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            make release TAG="${IMAGE_TAG}" TAG_LATEST=0
          else
            make release TAG="${IMAGE_TAG}"
          fi

      - name: Teardown local infra
        if: always()
        run: make teardown
