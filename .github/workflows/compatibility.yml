name: Compatibility Differential

# Pull requests run the fast manifest/mock lane plus real protocol differential
# smoke. The scheduled full lane adds Grafana; the separate drift schedule only
# reports newer image candidates and never becomes release evidence.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      selector:
        description: >-
          Select real service-backed validation, or the explicit mock harness
          path (mock is fast and is not compatibility evidence).
        required: false
        default: real
        type: choice
        options:
          - real
          - mock
          - drift
      drift_prometheus_image:
        description: Candidate Prometheus repository for drift mode
        required: false
        default: ""
        type: string
      drift_prometheus_version:
        description: Candidate Prometheus version for drift mode
        required: false
        default: ""
        type: string
      drift_prometheus_digest:
        description: Candidate Prometheus immutable digest for drift mode
        required: false
        default: ""
        type: string
      drift_loki_image:
        description: Candidate Loki repository for drift mode
        required: false
        default: ""
        type: string
      drift_loki_version:
        description: Candidate Loki version for drift mode
        required: false
        default: ""
        type: string
      drift_loki_digest:
        description: Candidate Loki immutable digest for drift mode
        required: false
        default: ""
        type: string
      drift_tempo_image:
        description: Candidate Tempo repository for drift mode
        required: false
        default: ""
        type: string
      drift_tempo_version:
        description: Candidate Tempo version for drift mode
        required: false
        default: ""
        type: string
      drift_tempo_digest:
        description: Candidate Tempo immutable digest for drift mode
        required: false
        default: ""
        type: string
      drift_grafana_image:
        description: Candidate Grafana repository for drift mode
        required: false
        default: ""
        type: string
      drift_grafana_version:
        description: Candidate Grafana version for drift mode
        required: false
        default: ""
        type: string
      drift_grafana_digest:
        description: Candidate Grafana immutable digest for drift mode
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 4 * * 0"

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-preflight:
    name: Real compatibility prerequisites
    if: ${{ (inputs.selector == '' || inputs.selector == 'real') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      DOCKER_CLIENT_TIMEOUT: "30"
      COMPOSE_HTTP_TIMEOUT: "30"
    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi
      - uses: actions/checkout@v5

      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Verify real runtime and required Grafana inputs
        run: |
          set -euo pipefail
          command -v docker
          docker info
          command -v ruby
          ruby --version
          command -v python3
          python3 --version
          command -v curl
          curl --version

  prometheus-diff:
    name: Prometheus differential
    if: ${{ (inputs.selector == '' || inputs.selector == 'real') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [real-preflight]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      PROMETHEUS_DIFF_ARTIFACT_DIR: ${{ github.workspace }}/target/compat/prometheus
      SOFTPROBE_COMPAT_ARTIFACT_DIR: ${{ github.workspace }}/target/compat/prometheus
      PROMETHEUS_RAW_ARTIFACT: ${{ github.workspace }}/target/compat/prometheus/raw.json
      PROMETHEUS_NORMALIZED_ARTIFACT: ${{ github.workspace }}/target/compat/prometheus/normalized.json
      DUCKDB_DOWNLOAD_LIB: "1"
      SOFTPROBE_API_KEY: ${{ secrets.SOFTPROBE_API_KEY }}
      SOFTPROBE_TENANT_A_API_KEY: ${{ secrets.SOFTPROBE_TENANT_A_API_KEY }}
      SOFTPROBE_TENANT_B_API_KEY: ${{ secrets.SOFTPROBE_TENANT_B_API_KEY }}

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Verify pinned compatibility references
        run: make check-compat-reference-pins

      - name: Run Prometheus differential gates
        run: make test-prom-compat

      - name: Require passing Prometheus result and evidence
        run: |
          set -euo pipefail
          root="$PROMETHEUS_DIFF_ARTIFACT_DIR"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          required_root = ("raw.json", "normalized.json")
          for name in required_root:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty Prometheus evidence: {path}")
          required_case = ("request.raw.json", "request.normalized.json", "lake.raw.json", "lake.normalized.json", "oracle.raw.json", "oracle.normalized.json")
          cases = sorted({path.parent for path in root.rglob("request.raw.json")})
          if not cases:
              raise SystemExit("Prometheus evidence has no per-case request artifact")
          for case in cases:
              for name in required_case:
                  path = case / name
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"missing or empty Prometheus case evidence: {path}")
          bad = {"skipped", "environment_skip", "infrastructure_failure", "product_regression", "fail", "failed", "error"}
          for path in root.rglob("*.json"):
              try:
                  obj = json.loads(path.read_text())
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"invalid Prometheus evidence JSON: {path}: {exc}")
              if path.name.endswith("outcome.json") and (not isinstance(obj, dict) or obj.get("status") != "pass"):
                  raise SystemExit(f"non-passing Prometheus outcome: {path}")
              if isinstance(obj, dict) and obj.get("status") in bad:
                  raise SystemExit(f"non-passing Prometheus result: {path}")
          PY

      - name: Stage sanitized Prometheus evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/compat/upload/prometheus
          python3 - target/compat/prometheus target/compat/upload/prometheus <<'PY'
          import os, pathlib, re, shutil, sys
          source, destination = map(pathlib.Path, sys.argv[1:])
          if not source.is_dir(): raise SystemExit(f"missing evidence directory: {source}")
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY")]
          values = [value for value in values if value]
          bearer = re.compile(r"(?i)(Bearer\s+)[^\s\"']+")
          for path in source.rglob("*"):
              if not path.is_file() or ".work" in path.parts: continue
              target = destination / path.relative_to(source); target.parent.mkdir(parents=True, exist_ok=True)
              try: text = path.read_text()
              except UnicodeDecodeError: shutil.copy2(path, target); continue
              for value in values: text = text.replace(value, "[REDACTED]")
              text = re.sub(r"(?im)^[ \t]*[\"']?authorization[\"']?\s*:\s*[^\r\n]*(?:\r?\n|$)", "", text)
              target.write_text(bearer.sub(r"\1[REDACTED]", text))
          PY

      - name: Scan Prometheus evidence for credentials and require upload inputs
        if: always()
        run: |
          set -euo pipefail
          test -d target/compat/upload/prometheus
          test -s target/compat/prometheus/raw.json
          test -s target/compat/prometheus/normalized.json
          python3 - target/compat/upload/prometheus <<'PY'
          import os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY")]
          values = [value.encode() for value in values if value]
          authorization = re.compile(rb"(?im)^\s*[\"']?authorization[\"']?\s*:")
          files = [path for path in root.rglob("*") if path.is_file()]
          if not files: raise SystemExit("Prometheus upload evidence is empty")
          for path in files:
              data = path.read_bytes()
              if any(value in data for value in values) or authorization.search(data):
                  raise SystemExit(f"unsanitized credential or Authorization header in {path}")
          PY

      - name: Upload Prometheus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-differential-evidence
          path: target/compat/upload/prometheus/
          if-no-files-found: error

  loki-diff:
    name: Loki differential
    if: ${{ (inputs.selector == '' || inputs.selector == 'real') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [real-preflight]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      LOKI_DIFF_ARTIFACT_DIR: ${{ github.workspace }}/target/compat/loki
      LOKI_DIFF_TIMEOUT_SECS: "900"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Verify Docker and pinned Loki reference
        run: |
          set -euo pipefail
          docker info
          make check-compat-reference-pins
          docker pull "$(make --no-print-directory compat-reference-image SIGNAL=loki)"

      - name: Run Loki differential gate
        run: make test-loki-diff

      - name: Require passing Loki result and evidence
        run: |
          set -euo pipefail
          root="$LOKI_DIFF_ARTIFACT_DIR"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if not root.is_dir():
              raise SystemExit(f"missing Loki evidence directory: {root}")
          for name in ("raw.json", "normalized.json"):
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty Loki evidence: {path}")
          required = ("request.raw.json", "request.normalized.json", "lake.raw.json", "lake.normalized.json", "oracle.raw.json", "oracle.normalized.json")
          cases = sorted({path.parent for path in root.rglob("request.raw.json")})
          if not cases:
              raise SystemExit("Loki evidence has no per-case directory")
          bad = {"skip", "skipped", "environment_skip", "infrastructure_failure", "product_regression", "fail", "failed", "failure", "error"}
          parsed = {}
          for path in root.rglob("*.json"):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty Loki JSON evidence: {path}")
              try:
                  parsed[path] = json.loads(path.read_text())
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"invalid Loki JSON evidence: {path}: {exc}")
              def reject_outcomes(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key in {"status", "outcome"} and isinstance(item, str) and item.lower() in bad:
                              raise SystemExit(f"non-passing Loki {key} in {path}: {item}")
                          reject_outcomes(item)
                  elif isinstance(value, list):
                      for item in value:
                          reject_outcomes(item)
              reject_outcomes(parsed[path])
          for case in cases:
              for name in required:
                  path = case / name
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"missing or empty Loki case evidence: {path}")
              lake = parsed[case / "lake.normalized.json"]
              oracle = parsed[case / "oracle.normalized.json"]
              if lake != oracle:
                  raise SystemExit(f"product-regression: Loki normalized lake/oracle mismatch: {case}")
          PY

      - name: Stage sanitized Loki evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/compat/upload/loki
          python3 - target/compat/loki target/compat/upload/loki <<'PY'
          import os, pathlib, re, shutil, sys
          source, destination = map(pathlib.Path, sys.argv[1:])
          if not source.exists():
              (destination / "FAILED.txt").write_text("real evidence directory missing\n")
              raise SystemExit(0)
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY")]
          values = [value for value in values if value]
          bearer = re.compile(r"(?i)(Bearer\s+)[^\s\"']+")
          for path in source.rglob("*"):
              if not path.is_file() or ".work" in path.parts: continue
              target = destination / path.relative_to(source); target.parent.mkdir(parents=True, exist_ok=True)
              try: text = path.read_text()
              except UnicodeDecodeError: shutil.copy2(path, target); continue
              for value in values: text = text.replace(value, "[REDACTED]")
              target.write_text(bearer.sub(r"\1[REDACTED]", text))
          PY

      - name: Upload Loki evidence paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loki-differential-evidence
          path: target/compat/upload/loki/
          if-no-files-found: error

  tempo-diff:
    name: Tempo differential
    if: ${{ (inputs.selector == '' || inputs.selector == 'real') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [real-preflight]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      TEMPO_DIFF_ARTIFACT_DIR: ${{ github.workspace }}/target/compat/tempo
      TEMPO_DIFF_TIMEOUT_SECS: "900"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Verify Docker and pinned Tempo reference
        run: |
          set -euo pipefail
          docker info
          make check-compat-reference-pins
          docker pull "$(make --no-print-directory compat-reference-image SIGNAL=tempo)"

      - name: Run Tempo differential gate
        run: make test-tempo-diff

      - name: Require passing Tempo result and evidence
        run: |
          set -euo pipefail
          root="$TEMPO_DIFF_ARTIFACT_DIR"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if not root.is_dir():
              raise SystemExit(f"missing Tempo evidence directory: {root}")
          for name in ("raw.json", "normalized.json"):
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty Tempo evidence: {path}")
          required = ("request.raw.json", "request.normalized.json", "lake.raw.json", "lake.normalized.json", "oracle.raw.json", "oracle.normalized.json")
          cases = sorted({path.parent for path in root.rglob("request.raw.json")})
          if not cases:
              raise SystemExit("Tempo evidence has no per-case directory")
          bad = {"skip", "skipped", "environment_skip", "infrastructure_failure", "product_regression", "fail", "failed", "failure", "error"}
          parsed = {}
          for path in root.rglob("*.json"):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty Tempo JSON evidence: {path}")
              try:
                  parsed[path] = json.loads(path.read_text())
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"invalid Tempo JSON evidence: {path}: {exc}")
              def reject_outcomes(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key in {"status", "outcome"} and isinstance(item, str) and item.lower() in bad:
                              raise SystemExit(f"non-passing Tempo {key} in {path}: {item}")
                          reject_outcomes(item)
                  elif isinstance(value, list):
                      for item in value:
                          reject_outcomes(item)
              reject_outcomes(parsed[path])
          for case in cases:
              for name in required:
                  path = case / name
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"missing or empty Tempo case evidence: {path}")
              lake = parsed[case / "lake.normalized.json"]
              oracle = parsed[case / "oracle.normalized.json"]
              if lake != oracle:
                  raise SystemExit(f"product-regression: Tempo normalized lake/oracle mismatch: {case}")
          PY

      - name: Stage sanitized Tempo evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/compat/upload/tempo
          python3 - target/compat/tempo target/compat/upload/tempo <<'PY'
          import os, pathlib, re, shutil, sys
          source, destination = map(pathlib.Path, sys.argv[1:])
          if not source.exists():
              (destination / "FAILED.txt").write_text("real evidence directory missing\n")
              raise SystemExit(0)
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY")]
          values = [value for value in values if value]
          bearer = re.compile(r"(?i)(Bearer\s+)[^\s\"']+")
          for path in source.rglob("*"):
              if not path.is_file() or ".work" in path.parts: continue
              target = destination / path.relative_to(source); target.parent.mkdir(parents=True, exist_ok=True)
              try: text = path.read_text()
              except UnicodeDecodeError: shutil.copy2(path, target); continue
              for value in values: text = text.replace(value, "[REDACTED]")
              target.write_text(bearer.sub(r"\1[REDACTED]", text))
          PY

      - name: Upload Tempo evidence paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-differential-evidence
          path: target/compat/upload/tempo/
          if-no-files-found: error

  grafana-system:
    name: Grafana system (${{ inputs.selector || 'real' }})
    # always() lets the job record prerequisite failures and still upload its
    # own evidence. The service-backed steps below are gated on success.
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.selector == 'drift') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [real-preflight, prometheus-diff, loki-diff, tempo-diff]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      SOFTPROBE_URL: ${{ secrets.SOFTPROBE_URL }}
      SOFTPROBE_API_KEY: ${{ secrets.SOFTPROBE_API_KEY }}
      SOFTPROBE_TENANT_A_API_KEY: ${{ secrets.SOFTPROBE_TENANT_A_API_KEY }}
      SOFTPROBE_TENANT_B_API_KEY: ${{ secrets.SOFTPROBE_TENANT_B_API_KEY }}
      SOFTPROBE_TENANT_A_ID: ${{ secrets.SOFTPROBE_TENANT_A_ID }}
      SOFTPROBE_TENANT_B_ID: ${{ secrets.SOFTPROBE_TENANT_B_ID }}

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Initialize Grafana evidence directory
        run: |
          set -euo pipefail
          mkdir -p target/compat/grafana
          selector="${{ inputs.selector || 'real' }}"
          printf 'selector=%s\n' "$selector" > target/compat/grafana/selector.txt
          if [[ "$selector" == mock ]]; then
            printf '%s\n' \
              'This artifact was produced by the explicit mock/fast harness selector.' \
              'It is not service-backed Grafana compatibility evidence.' \
              > target/compat/grafana/NOTICE.txt
          fi

      - name: Run static Grafana Phase 4 contracts
        run: make test-grafana-static

      - name: Require successful protocol prerequisites for real validation
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        env:
          PROMETHEUS_RESULT: ${{ needs.prometheus-diff.result }}
          LOKI_RESULT: ${{ needs.loki-diff.result }}
          TEMPO_RESULT: ${{ needs.tempo-diff.result }}
        run: |
          set -euo pipefail
          failed=0
          for prerequisite in \
            "prometheus-diff=$PROMETHEUS_RESULT" \
            "loki-diff=$LOKI_RESULT" \
            "tempo-diff=$TEMPO_RESULT"; do
            if [[ "${prerequisite#*=}" != success ]]; then
              echo "Prerequisite did not succeed: $prerequisite" | tee -a target/compat/grafana/summary.txt
              failed=1
            fi
          done
          if (( failed )); then
            echo "Real Grafana validation was not run." | tee -a target/compat/grafana/summary.txt
            exit 1
          fi

      - name: Run real Grafana system harness
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        env:
          GRAFANA_REFERENCE_MANIFEST: docs/compat/references.v0.yaml
          SOFTPROBE_URL: ${{ secrets.SOFTPROBE_URL }}
          SOFTPROBE_API_KEY: ${{ secrets.SOFTPROBE_API_KEY }}
          SOFTPROBE_TENANT_A_API_KEY: ${{ secrets.SOFTPROBE_TENANT_A_API_KEY }}
          SOFTPROBE_TENANT_B_API_KEY: ${{ secrets.SOFTPROBE_TENANT_B_API_KEY }}
          SOFTPROBE_TENANT_A_ID: ${{ secrets.SOFTPROBE_TENANT_A_ID }}
          SOFTPROBE_TENANT_B_ID: ${{ secrets.SOFTPROBE_TENANT_B_ID }}
        run: make test-grafana-system

      - name: Require passing real Grafana results and evidence
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        run: |
          set -euo pipefail
          root=target/compat/grafana
          test -d "$root"
          test -s "$root/outcome.json"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          bad = {"skipped", "environment_skip", "infrastructure_failure", "product_regression"}
          root = pathlib.Path(sys.argv[1])
          overall = json.loads((root / "outcome.json").read_text())
          if overall.get("outcome") == "environment_skip":
              reason = overall.get("reason", "")
              if reason not in {"Docker unavailable", "GNU timeout unavailable"}:
                  raise SystemExit(f"unapproved Grafana environment skip: {reason}")
              if list(root.glob("G*.outcome.json")):
                  raise SystemExit("environment-skipped Grafana run unexpectedly produced G-case results")
              print(f"Grafana system lane permitted environment skip: {reason}")
              raise SystemExit(0)
          case_paths = [root / f"G{case_id}.outcome.json" for case_id in range(1, 9)]
          missing = [str(path) for path in case_paths if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("missing Grafana case evidence: " + ", ".join(missing))
          paths = [root / "outcome.json", *case_paths]
          for path in paths:
              obj = json.loads(path.read_text())
              outcome = obj.get("outcome")
              if outcome != "pass" or outcome in bad:
                  raise SystemExit(f"non-passing Grafana result: {path}")
          PY

      - name: Run explicit mock Grafana harness
        if: ${{ inputs.selector == 'mock' }}
        env:
          MOCK: "1"
          GRAFANA_CHECK_DASHBOARD_QUERIES: "1"
          ARTIFACT_DIR: target/compat/grafana
        run: scripts/grafana-system-smoke.sh

      - name: Stage sanitized Grafana evidence
        if: always()
        run: |
          set -euo pipefail
          test -d target/compat/grafana
          test -n "$(find target/compat/grafana -type f -print -quit)"
          rm -rf target/compat/upload/grafana
          mkdir -p target/compat/upload/grafana
          python3 - target/compat/grafana target/compat/upload/grafana <<'PY'
          import os, pathlib, re, shutil, sys
          source, destination = map(pathlib.Path, sys.argv[1:])
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY", "GRAFANA_ADMIN_PASSWORD")]
          values = [value for value in values if value]
          bearer = re.compile(r"(?i)(Bearer\s+)[^\s\"']+")
          for path in source.rglob("*"):
              if not path.is_file() or ".work" in path.parts: continue
              target = destination / path.relative_to(source); target.parent.mkdir(parents=True, exist_ok=True)
              try: text = path.read_text()
              except UnicodeDecodeError: shutil.copy2(path, target); continue
              for value in values: text = text.replace(value, "[REDACTED]")
              target.write_text(bearer.sub(r"\1[REDACTED]", text))
          PY
          test -n "$(find target/compat/upload/grafana -type f -print -quit)"

      - name: Upload Grafana system evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-system-${{ inputs.selector || 'real' }}-evidence
          path: target/compat/upload/grafana/
          if-no-files-found: error

  manifest-conformance:
    name: Manifest conformance (${{ matrix.protocol }}, ${{ inputs.selector || 'real' }})
    # The matrix is deliberately after all protocol and Grafana prerequisites.
    # Mock mode still reaches this job because the prerequisite jobs are skipped.
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.selector == 'drift') && !(github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [real-preflight, prometheus-diff, loki-diff, tempo-diff, grafana-system]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protocol: [prometheus, loki, tempo]
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      MANIFEST: tests/compat/manifests/cases.v0.yaml
      OUT: target/compat/conformance/${{ matrix.protocol }}

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Initialize conformance evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          selector="${{ inputs.selector || 'real' }}"
          printf 'selector=%s\nprotocol=%s\n' "$selector" "${{ matrix.protocol }}" > "$OUT/selector.txt"
          if [[ "$selector" == mock ]]; then
            printf '%s\n' \
              'This artifact was produced by the explicit mock/fast harness selector.' \
              'Mock comparisons are manifest-shaped checks, not service-backed compatibility evidence.' \
              > "$OUT/NOTICE.txt"
          fi

      - name: Require successful prerequisites for real conformance
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        env:
          PROMETHEUS_RESULT: ${{ needs.prometheus-diff.result }}
          LOKI_RESULT: ${{ needs.loki-diff.result }}
          TEMPO_RESULT: ${{ needs.tempo-diff.result }}
          GRAFANA_RESULT: ${{ needs.grafana-system.result }}
        run: |
          set -euo pipefail
          failed=0
          for prerequisite in \
            "prometheus-diff=$PROMETHEUS_RESULT" \
            "loki-diff=$LOKI_RESULT" \
            "tempo-diff=$TEMPO_RESULT" \
            "grafana-system=$GRAFANA_RESULT"; do
            if [[ "${prerequisite#*=}" != success ]]; then
              echo "Prerequisite did not succeed: $prerequisite" | tee -a "$OUT/summary.txt"
              failed=1
            fi
          done
          if (( failed )); then
            echo "Real manifest conformance was not run." | tee -a "$OUT/summary.txt"
            exit 1
          fi

      - name: Run real manifest conformance selector
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        run: |
          set -euo pipefail
          scripts/compat/conformance.sh \
            --protocol "${{ matrix.protocol }}" \
            --out "$OUT"

      - name: Require complete real per-case conformance evidence
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        env:
          PROTOCOL: ${{ matrix.protocol }}
        run: |
          set -euo pipefail
          ruby -ryaml -rjson <<'RUBY'
          manifest = YAML.load_file(ENV.fetch("MANIFEST"))
          root = ENV.fetch("OUT")
          protocol = ENV.fetch("PROTOCOL")
          cases = manifest.fetch("cases").select { |entry| entry.fetch("protocol") == protocol }
          report = File.join(root, "report.jsonl")
          abort "missing report.jsonl" unless File.file?(report)
          rows = File.readlines(report, chomp: true).reject(&:empty?).map { |line| JSON.parse(line) }
          ids = cases.map { |entry| entry.fetch("id") }
          grouped = rows.group_by { |row| row.fetch("case_id") }
          abort "duplicate, missing, or extra conformance cases" unless ids.sort == grouped.keys.sort && grouped.values.all? { |values| values.one? }
          rows.each do |row|
            case_entry = cases.find { |c| c["id"] == row["case_id"] }
            if case_entry && case_entry["conformance_exclusion"]
              abort "excluded case has invalid skipped result: #{row['case_id']}" unless row["mode"] == "real" && row["status"] == "skipped" && row["outcome"] == "conformance_exclusion"
            else
              abort "non-passing or non-release real conformance result: #{row['case_id']}" unless row["mode"] == "real" && row["status"] == "pass" && row["release_evidence"] == true
            end
          end
          versions = JSON.parse(File.read(File.join(root, "versions.json")))
          abort "conformance mode is not real" unless versions["mode"] == "real"
          abort "conformance release evidence is not asserted" unless versions["release_evidence"] == true
          ids.each do |id|
            dir = File.join(root, id)
            case_entry = cases.find { |c| c["id"] == id }
            is_excluded = case_entry && case_entry["conformance_exclusion"]
            required = %w[case.json case_provenance.json request.raw.json request.normalized.json softprobe.raw.json softprobe.normalized.json reference.raw.json reference.normalized.json diff.json outcome.json suite.evidence.json]
            missing = required.reject { |name| File.file?(File.join(dir, name)) }
            abort "#{id}: missing #{missing.join(', ')}" unless missing.empty?
            outcome = JSON.parse(File.read(File.join(dir, "outcome.json")))
            diff = JSON.parse(File.read(File.join(dir, "diff.json")))
            diff_equal = diff.key?("equal") ? (diff["equal"] == true) : (diff.dig("payload", "equal") == true)
            if is_excluded
              abort "#{id}: invalid excluded real evidence" unless outcome["mode"] == "real" && outcome["status"] == "skipped" && outcome["reason"] == "conformance_exclusion"
              abort "#{id}: excluded diff comparison failed" unless diff_equal && diff["classification"] == "skipped"
            else
              abort "#{id}: incomplete real evidence" unless outcome["mode"] == "real" && outcome["status"] == "pass" && outcome["evidence_scope"] == "case" && outcome["release_evidence"] == true
              abort "#{id}: normalized comparison failed or is not release evidence" unless diff_equal && diff["release_evidence"] == true
            end
          end
          RUBY

      - name: Validate real conformance artifact set
        if: ${{ inputs.selector == '' || inputs.selector == 'real' }}
        run: scripts/compat/validate-artifacts.sh --root "$OUT" --release-gate

      - name: Run explicit mock manifest conformance selector
        if: ${{ inputs.selector == 'mock' }}
        run: |
          set -euo pipefail
          scripts/compat/conformance.sh \
            --mock \
            --protocol "${{ matrix.protocol }}" \
            --out "$OUT"

      - name: Assert mock conformance is visibly non-evidence
        if: ${{ inputs.selector == 'mock' }}
        run: |
          set -euo pipefail
          test -s "$OUT/NOTICE.txt"
          rg -qi 'MOCK-ONLY|not service-backed|not.*compatibility evidence' "$OUT/NOTICE.txt"
          rg -qi 'mock' "$OUT/versions.json"

      - name: Validate mock conformance artifact set
        if: ${{ inputs.selector == 'mock' }}
        run: scripts/compat/validate-artifacts.sh --root "$OUT"

      - name: Stage sanitized conformance evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/compat/upload/conformance/${{ matrix.protocol }}
          python3 - "$OUT" "target/compat/upload/conformance/${{ matrix.protocol }}" <<'PY'
          import os, pathlib, re, shutil, sys
          source, destination = map(pathlib.Path, sys.argv[1:])
          values = [os.environ.get(name, "") for name in ("SOFTPROBE_API_KEY", "SOFTPROBE_TENANT_A_API_KEY", "SOFTPROBE_TENANT_B_API_KEY")]
          values = [value for value in values if value]
          bearer = re.compile(r"(?i)(Bearer\s+)[^\s\"']+")
          for path in source.rglob("*"):
              if not path.is_file() or ".work" in path.parts: continue
              target = destination / path.relative_to(source); target.parent.mkdir(parents=True, exist_ok=True)
              try: text = path.read_text()
              except UnicodeDecodeError: shutil.copy2(path, target); continue
              for value in values: text = text.replace(value, "[REDACTED]")
              target.write_text(bearer.sub(r"\1[REDACTED]", text))
          PY

      - name: Upload manifest conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-conformance-${{ matrix.protocol }}-${{ inputs.selector || 'real' }}-evidence
          path: target/compat/upload/conformance/${{ matrix.protocol }}/
          if-no-files-found: error

  drift-preflight:
    name: Scheduled candidate drift prerequisites
    if: ${{ inputs.selector == 'drift' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      DRIFT_PROMETHEUS_IMAGE: ${{ inputs.drift_prometheus_image || vars.COMPAT_DRIFT_PROMETHEUS_IMAGE || secrets.COMPAT_DRIFT_PROMETHEUS_IMAGE }}
      DRIFT_PROMETHEUS_VERSION: ${{ inputs.drift_prometheus_version || vars.COMPAT_DRIFT_PROMETHEUS_VERSION || secrets.COMPAT_DRIFT_PROMETHEUS_VERSION }}
      DRIFT_PROMETHEUS_DIGEST: ${{ inputs.drift_prometheus_digest || vars.COMPAT_DRIFT_PROMETHEUS_DIGEST || secrets.COMPAT_DRIFT_PROMETHEUS_DIGEST }}
      DRIFT_LOKI_IMAGE: ${{ inputs.drift_loki_image || vars.COMPAT_DRIFT_LOKI_IMAGE || secrets.COMPAT_DRIFT_LOKI_IMAGE }}
      DRIFT_LOKI_VERSION: ${{ inputs.drift_loki_version || vars.COMPAT_DRIFT_LOKI_VERSION || secrets.COMPAT_DRIFT_LOKI_VERSION }}
      DRIFT_LOKI_DIGEST: ${{ inputs.drift_loki_digest || vars.COMPAT_DRIFT_LOKI_DIGEST || secrets.COMPAT_DRIFT_LOKI_DIGEST }}
      DRIFT_TEMPO_IMAGE: ${{ inputs.drift_tempo_image || vars.COMPAT_DRIFT_TEMPO_IMAGE || secrets.COMPAT_DRIFT_TEMPO_IMAGE }}
      DRIFT_TEMPO_VERSION: ${{ inputs.drift_tempo_version || vars.COMPAT_DRIFT_TEMPO_VERSION || secrets.COMPAT_DRIFT_TEMPO_VERSION }}
      DRIFT_TEMPO_DIGEST: ${{ inputs.drift_tempo_digest || vars.COMPAT_DRIFT_TEMPO_DIGEST || secrets.COMPAT_DRIFT_TEMPO_DIGEST }}
      DRIFT_GRAFANA_IMAGE: ${{ inputs.drift_grafana_image || vars.COMPAT_DRIFT_GRAFANA_IMAGE || secrets.COMPAT_DRIFT_GRAFANA_IMAGE }}
      DRIFT_GRAFANA_VERSION: ${{ inputs.drift_grafana_version || vars.COMPAT_DRIFT_GRAFANA_VERSION || secrets.COMPAT_DRIFT_GRAFANA_VERSION }}
      DRIFT_GRAFANA_DIGEST: ${{ inputs.drift_grafana_digest || vars.COMPAT_DRIFT_GRAFANA_DIGEST || secrets.COMPAT_DRIFT_GRAFANA_DIGEST }}
    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi
      - uses: actions/checkout@v5
      - name: Ensure compatibility toolchain
        uses: ./.github/actions/compat-deps

      - name: Load baseline references from manifest
        run: scripts/compat/export-reference-env.sh >> "$GITHUB_ENV"

      - name: Initialize drift metadata after checkout
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/compat/drift/preflight
          python3 - <<'PY'
          import json, os
          data = {
              "mode": "drift",
              "release_evidence": False,
              "status": "pending",
              "candidate": {key.removeprefix("DRIFT_").lower(): os.environ.get(key, "") for key in (
                  "DRIFT_PROMETHEUS_IMAGE", "DRIFT_PROMETHEUS_VERSION", "DRIFT_PROMETHEUS_DIGEST", "DRIFT_LOKI_IMAGE", "DRIFT_LOKI_VERSION", "DRIFT_LOKI_DIGEST",
                  "DRIFT_TEMPO_IMAGE", "DRIFT_TEMPO_VERSION", "DRIFT_TEMPO_DIGEST", "DRIFT_GRAFANA_IMAGE", "DRIFT_GRAFANA_VERSION", "DRIFT_GRAFANA_DIGEST")},
              "baseline": {key.removeprefix("BASELINE_").lower(): os.environ.get(key, "") for key in (
                  "BASELINE_PROMETHEUS_IMAGE", "BASELINE_PROMETHEUS_VERSION", "BASELINE_LOKI_IMAGE", "BASELINE_LOKI_VERSION",
                  "BASELINE_TEMPO_IMAGE", "BASELINE_TEMPO_VERSION", "BASELINE_GRAFANA_IMAGE", "BASELINE_GRAFANA_VERSION")},
          }
          json.dump(data, open("target/compat/drift/preflight/metadata.json", "w"), indent=2)
          PY

      - name: Validate and pull candidate references
        run: |
          set -euo pipefail
          docker info >/dev/null
          python3 - <<'PY'
          import os, re
          pairs = (
              ("PROMETHEUS", os.environ["BASELINE_PROMETHEUS_IMAGE"], os.environ["BASELINE_PROMETHEUS_VERSION"]),
              ("LOKI", os.environ["BASELINE_LOKI_IMAGE"], os.environ["BASELINE_LOKI_VERSION"]),
              ("TEMPO", os.environ["BASELINE_TEMPO_IMAGE"], os.environ["BASELINE_TEMPO_VERSION"]),
              ("GRAFANA", os.environ["BASELINE_GRAFANA_IMAGE"], os.environ["BASELINE_GRAFANA_VERSION"]),
          )
          for name, baseline_image, baseline_version in pairs:
              image = os.environ.get(f"DRIFT_{name}_IMAGE", "")
              version = os.environ.get(f"DRIFT_{name}_VERSION", "")
              if not image or not version:
                  raise SystemExit(f"missing candidate {name.lower()} image/version")
              if not re.fullmatch(r"[A-Za-z0-9._/-]+(?::[0-9]+)?", image) or "@" in image:
                  raise SystemExit(f"invalid candidate {name.lower()} image")
              if version.lower() == "latest" or "latest" in version.lower() or any(char.isspace() for char in version):
                  raise SystemExit(f"mutable candidate {name.lower()} version")
              if version == baseline_version:
                  raise SystemExit(f"candidate {name.lower()} version is unchanged from baseline")
          for name in ("PROMETHEUS", "LOKI", "TEMPO", "GRAFANA"):
              digest = os.environ.get(f"DRIFT_{name}_DIGEST", "")
              if not re.fullmatch(r"sha256:[0-9a-fA-F]{64}", digest):
                  raise SystemExit(f"{name.lower()} drift candidate requires an immutable sha256 digest")
          PY
          for signal in prometheus loki tempo grafana; do
            upper=$(printf '%s' "$signal" | tr '[:lower:]' '[:upper:]')
            image_var="DRIFT_${upper}_IMAGE"
            digest_var="DRIFT_${upper}_DIGEST"
            candidate_reference="${!image_var}@${!digest_var}"
            docker pull "$candidate_reference" >/dev/null
            repo_digests=$(docker image inspect --format '{{json .RepoDigests}}' "$candidate_reference")
            printf '%s' "$repo_digests" | grep -Fq -- "$candidate_reference" || {
              echo "$signal candidate digest does not match the pulled immutable reference" >&2
              exit 1
            }
          done
          python3 - <<'PY'
          import json
          data = json.load(open("target/compat/drift/preflight/metadata.json"))
          data["status"] = "pass"
          json.dump(data, open("target/compat/drift/preflight/metadata.json", "w"), indent=2)
          PY

      - name: Record drift preflight failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          mkdir -p target/compat/drift/preflight
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("target/compat/drift/preflight/metadata.json")
          try:
              data = json.loads(path.read_text())
          except (OSError, ValueError):
              data = {"mode": "drift", "release_evidence": False}
          data["status"] = "infrastructure_failure"
          data["failure_reason"] = "preflight_validation_failed"
          data["release_evidence"] = False
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Upload drift preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-drift-preflight-evidence
          path: target/compat/drift/preflight/
          if-no-files-found: error

  drift-prometheus:
    name: Drift Prometheus candidate
    if: ${{ inputs.selector == 'drift' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    needs: [drift-preflight]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      DRIFT_CANDIDATE_IMAGE: ${{ inputs.drift_prometheus_image || vars.COMPAT_DRIFT_PROMETHEUS_IMAGE || secrets.COMPAT_DRIFT_PROMETHEUS_IMAGE }}
      DRIFT_CANDIDATE_VERSION: ${{ inputs.drift_prometheus_version || vars.COMPAT_DRIFT_PROMETHEUS_VERSION || secrets.COMPAT_DRIFT_PROMETHEUS_VERSION }}
