name: CI

# Pre-merge / main push gate: fmt + lint + tests (CI=true → --release).
# Performance is manual; product dist/ is built in release.yml via make release.
# Warm SLO: ci-full ≤ 15m (ENFORCE_SLO); hard timeout 45m for cold DuckDB.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and test
    runs-on: [self-hosted, Linux]
    timeout-minutes: 45
    env:
      CI: "true"
      ENFORCE_SLO: "1"

    steps:
      - name: Pre-clean workspace permissions
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          if [[ -d "$WS" ]]; then
            sudo rm -rf "$WS/warehouse" || true
            sudo chown -R "$(id -u):$(id -g)" "$WS" || true
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-thelake-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-thelake-ci-
            ${{ runner.os }}-thelake-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep curl clang mold

      - name: Doctor
        run: make doctor-ci

      - name: Start local test infra
        run: make setup-local

      - name: CI checks (fmt, lint, tests)
        run: make ci-full

      - name: Teardown local infra
        if: always()
        run: make teardown-local
