name: CI

# Pre-merge / main push gate. Performance is a separate manual workflow.
# Warm self-hosted SLO: make ci-full ≤ 15m (hard timeout 20m).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    env:
      CI: "true"
      ENFORCE_SLO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep curl clang mold

      - name: Doctor
        run: make doctor-ci

      - name: Start local test infra
        run: make setup-local

      - name: CI checks (fmt, lint, build-release, tests)
        run: make ci-full

      - name: Teardown local infra
        if: always()
        run: make teardown-local
