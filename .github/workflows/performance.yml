name: Performance Tests

# Manual only — not part of the PR/main CI gate.
# Warm self-hosted SLO: make test-perf ≤ 8m (hard timeout 15m).
# Quality bar: PERF_TARGET_MS=1000 (warm union_logs p95 < 1s).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Performance suite filter (PERF_SUITE)"
        required: false
        default: all
        type: choice
        options:
          - all
          - latency
          - concurrency
          - stability

jobs:
  performance:
    name: Performance (${{ inputs.suite }})
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      CI: "true"
      ENFORCE_SLO: "1"
      PERF_TARGET_MS: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep curl clang mold

      - name: Doctor
        run: make doctor-ci

      - name: Start local test infra
        run: make setup-local

      - name: Run performance suite
        run: make test-perf PERF_SUITE=${{ inputs.suite }}

      - name: Teardown local infra
        if: always()
        run: make teardown-local
