name: Softprobe build cache
description: Restore and save Cargo registry + target under ~/.cache/softprobe.
runs:
  using: composite
  steps:
    - name: Restore Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.HOME }}/.cache/softprobe/cargo
          ${{ env.HOME }}/.cache/softprobe/target
        key: softprobe-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          softprobe-${{ runner.os }}-rust-

    - name: Prepare cache directories
      shell: bash
      run: mkdir -p "$HOME/.cache/softprobe/cargo" "$HOME/.cache/softprobe/target"
