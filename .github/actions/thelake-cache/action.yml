name: TheLake build cache
description: Restore and save Cargo registry + target under ~/.cache/thelake.
runs:
  using: composite
  steps:
    - name: Restore Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.HOME }}/.cache/thelake/cargo
          ${{ env.HOME }}/.cache/thelake/target
        key: thelake-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          thelake-${{ runner.os }}-rust-

    - name: Prepare cache directories
      shell: bash
      run: mkdir -p "$HOME/.cache/thelake/cargo" "$HOME/.cache/thelake/target"
