name: Ubuntu runner bootstrap
description: Rust toolchain and Linux packages for GitHub-hosted ubuntu-latest CI.
runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          build-essential \
          clang \
          cmake \
          curl \
          mold \
          pkg-config \
          libssl-dev \
          protobuf-compiler \
          python3 \
          ripgrep \
          ruby-full

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
