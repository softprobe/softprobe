server:
  port: 8090
  host: "0.0.0.0"
  max_body_size: 104857600  # 100MB
  worker_threads: null

# Non-secret object-store settings. Credentials come from the environment:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for s3:// (MinIO/R2/AWS)
#   GCS_HMAC_ACCESS_KEY_ID / GCS_HMAC_SECRET for gs://
object_store:
  region: "us-east-1"
  endpoint: "http://localhost:9000"  # Local MinIO

query:
  max_connections: 10
  cache_dir: "/tmp/ingest-cache"

maintenance:
  enabled: true
  target_file_size_bytes: 67108864  # 64MB
  interval_seconds: 3600  # 1 hour
  metadata_enabled: true
  metadata_interval_seconds: 3600
  max_snapshot_age_seconds: 604800
  remove_orphan_files_enabled: true
  remove_orphan_older_than_seconds: 3600

ducklake:
  catalog_type: "postgres"
  metadata_path: "host=localhost port=5432 dbname=ducklake user=ducklake password=ducklake"
  data_path: "./warehouse/ducklake/data/"
  catalog_alias: "softprobe"
  metadata_schema: "softprobe"
  # Inline collector-sized batches into Postgres catalog (avoid tiny GCS/S3 parquet).
  data_inlining_row_limit: 10000
  # Per-scope DuckDB writer connections (1..=16). Default 4.
  writer_pool_size: 4

# UI dropdown EAV (Postgres); requires ducklake.catalog_type=postgres
dropdown_catalog:
  enabled: false
  active_values_days: 7
  maintenance_prune_enabled: true
  upsert_batch_size: 500
