openapi: 3.1.0
info:
  title: Softprobe Runtime Write API
  version: 0.1.0
  description: |
    Authenticated OTLP-compatible ingestion API exposed by softprobe-runtime.

    This API accepts telemetry payloads on standard OTLP HTTP paths:
    - `POST /v1/traces`
    - `POST /v1/logs`
    - `POST /v1/metrics`

    It also documents the tenant-scoped schema promotion endpoint:
    - `POST /v1/promotions/apply`

    LLM evaluations are written through:
    - `POST /v1/llm/scores`
    - `GET|POST /v1/llm/score-configs`

    LLM query surfaces (canonical schemas also live in softprobe/sp-llm):
    - `POST /v1/llm/observations/search`
    - `GET /v1/llm/observations/{span_id}`
    - `GET /v1/llm/traces/{trace_id}`
    - `GET /v1/llm/sessions/{session_id}`

    For JSON payloads, requests are expected to follow the OpenTelemetry collector export
    request shapes (`ExportTraceServiceRequest`, `ExportLogsServiceRequest`, and
    `ExportMetricsServiceRequest`).

    For protobuf payloads, send binary OTLP with `Content-Type: application/x-protobuf`.

    Content type behavior mirrors implementation:
    - Any `Content-Type` containing `protobuf` is treated as protobuf.
    - All other content types (including missing header) are treated as JSON.
    - Each accepted request is committed directly to the tenant's DuckLake scope.
    - Durable write failures return HTTP 503 so the exporter can retry.

    Canonical promotion contract (manifest YAML, lifecycle, failure modes):
    `docs/promotion.md`.
  externalDocs:
    description: Softprobe schema promotion guide
    url: ./promotion.md
servers:
  - url: http://localhost:8090
    description: Local endpoint from default `config.yaml`
tags:
  - name: ingestion
    description: OTLP ingestion endpoints
  - name: promotion
    description: Tenant-scoped schema promotion
  - name: llm
    description: LLM observability records
security:
  - bearerAuth: []
paths:
  /v1/traces:
    post:
      tags:
        - ingestion
      summary: Ingest OTLP traces
      operationId: ingestTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTraceServiceRequest"
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Protobuf-encoded `ExportTraceServiceRequest`
      responses:
        "200":
          description: Request accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON/protobuf payload
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                invalidJson:
                  value: Invalid JSON
                invalidProtobuf:
                  value: Protobuf decode failed
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "413":
          description: Request exceeds `server.max_body_size`
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /v1/logs:
    post:
      tags:
        - ingestion
      summary: Ingest OTLP logs
      operationId: ingestLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportLogsServiceRequest"
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Protobuf-encoded `ExportLogsServiceRequest`
      responses:
        "200":
          description: Request accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON/protobuf payload
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                invalidJson:
                  value: "Invalid JSON: expected value at line 1 column 1"
                invalidProtobuf:
                  value: Protobuf decode failed
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "413":
          description: Request exceeds `server.max_body_size`
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /v1/metrics:
    post:
      tags:
        - ingestion
      summary: Ingest OTLP metrics
      operationId: ingestMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportMetricsServiceRequest"
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Protobuf-encoded `ExportMetricsServiceRequest`
      responses:
        "200":
          description: Request accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON/protobuf payload
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                invalidJson:
                  value: Invalid JSON
                invalidProtobuf:
                  value: Invalid protobuf
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "413":
          description: Request exceeds `server.max_body_size`
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /v1/llm/scores:
    post:
      tags:
        - llm
      summary: Create an immutable LLM evaluation score
      description: |
        Creates a score in the authenticated tenant's DuckLake scope. Tenant
        identity is resolved from the bearer token and is never accepted in
        the request body.

        At least one target (`trace_id`, `span_id`, or `session_id`) is
        required. Exactly one value field must be present and must match
        `data_type`:

        - `numeric` uses `numeric_value`
        - `categorical` and `text` use `string_value`
        - `boolean` uses `boolean_value`

        `score_id` is the tenant-local idempotency key. Repeating a previously
        accepted ID does not append another score row.
      operationId: createScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoreRequest"
            examples:
              correctness:
                value:
                  score_id: score-01JZ8YH3KQBZ8V2CA9ZB1W7Q9A
                  timestamp: "2026-07-18T23:22:00Z"
                  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                  span_id: 00f067aa0ba902b7
                  name: correctness
                  data_type: numeric
                  numeric_value: 0.92
                  source: evaluator
                  comment: Answer is supported by the retrieved context.
                  metadata:
                    evaluator: groundedness-v2
      responses:
        "201":
          description: Score created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "200":
          description: Idempotent retry; the score ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        "400":
          description: Missing target, missing value, or value does not match `data_type`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "422":
          description: Malformed JSON or field type mismatch
        "503":
          description: Tenant runtime, idempotency lookup, or DuckLake write unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/score-configs:
    get:
      tags:
        - llm
      summary: List score configs (seeds defaults when empty)
      description: |
        Returns append-only score schemas for the authenticated tenant. When the
        tenant has no configs yet, the server seeds built-in defaults
        (`correctness`, `quality`, `expected_output`) and returns them.
      operationId: listScoreConfigs
      responses:
        "200":
          description: Score config list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfigListResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or DuckLake unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - llm
      summary: Create an append-only score config
      description: |
        Creates a score config in the authenticated tenant's DuckLake scope.
        `config_id` is the tenant-local idempotency key.
      operationId: createScoreConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoreConfigRequest"
            examples:
              correctness:
                value:
                  config_id: cfg-correctness
                  timestamp: "2026-07-18T23:22:00Z"
                  name: correctness
                  data_type: boolean
                  description: Whether the turn was correct
                  author_id: system
      responses:
        "201":
          description: Score config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfig"
        "200":
          description: Existing config returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreConfig"
        "400":
          description: Invalid score config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or DuckLake write unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/observations/search:
    post:
      tags:
        - llm
      summary: Search lightweight LLM observation projections
      description: |
        Requires `from` and `to`. Returns lightweight observation rows without
        full attributes/events. LLM fields are derived from span attributes
        (`gen_ai.*`, `sp.*`) and do not require promotion to be applied.
        Cursor ordering is `(timestamp DESC, span_id DESC)`.
      operationId: searchObservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationSearchRequest"
      responses:
        "200":
          description: Bounded observation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationSearchResponse"
        "400":
          description: Missing time range, invalid filter, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/observations/{span_id}:
    get:
      tags:
        - llm
      summary: Get one observation with full payload and attached scores
      operationId: getObservation
      parameters:
        - name: span_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Observation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDetail"
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/traces/{trace_id}:
    get:
      tags:
        - llm
      summary: Get a derived trace summary, observations, and scores
      operationId: getTrace
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceDetail"
        "400":
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/llm/sessions/{session_id}:
    get:
      tags:
        - llm
      summary: Get a time-bounded session summary
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Missing time range, invalid limit, or malformed cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No session activity in the requested range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid bearer token
        "503":
          description: Tenant runtime or query unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/promotions/apply:
    post:
      tags:
        - promotion
      summary: Apply a tenant-scoped promotion manifest
      description: |
        Parses a `softprobe.promotion.v1` YAML manifest, applies DuckLake schema
        changes for the authenticated tenant, and records the active spec in that
        tenant's metadata schema.

        Requirements and semantics:
        - Requires a PostgreSQL DuckLake catalog with a tenant scope registry.
          SQLite local catalogs return `503 ducklake_connection_unavailable`.
        - Telemetry-column promotions extract values on subsequent OTLP ingest
          for that tenant. Historical rows are not backfilled.
        - Invalid JSON/type conversion during telemetry extraction fails the
          ingest batch. A corrupt active `promotion_specs` row can also block
          tenant ingest.
        - Business-table apply provisions `<table>_vN` + `<table>_current` and
          records the spec; automatic OTLP row materialization is not wired yet.
        - Full contract: `docs/promotion.md`.
      operationId: applyPromotion
      externalDocs:
        description: Canonical promotion guide
        url: ./promotion.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionApplyRequest"
            examples:
              telemetryColumns:
                summary: Promote sp.user.id to traces.user_id
                value:
                  manifestYaml: |
                    specVersion: softprobe.promotion.v1
                    target:
                      kind: telemetry_columns
                      tables: [traces]
                    columns:
                      - name: user_id
                        type: string
                        nullable: true
                        source:
                          from: attribute
                          key: sp.user.id
              businessTable:
                summary: Provision a versioned business table
                value:
                  manifestYaml: |
                    specVersion: softprobe.promotion.v1
                    target:
                      kind: business_table
                      table: checkout_orders
                      version: 1
                    rowSelector:
                      attribute:
                        key: sp.workflow
                        equals: checkout
                    columns:
                      - name: order_id
                        type: string
                        nullable: false
                        source:
                          from: http_response_body
                          json_path: $.order.id
      responses:
        "200":
          description: Manifest validated and schema changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionApplyResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Bearer token could not be resolved to a tenant
        "422":
          description: Invalid YAML or promotion validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionErrorResponse"
              examples:
                notNullable:
                  value:
                    error:
                      code: telemetry_column_not_nullable
                      message: "telemetry_column_not_nullable at columns[0].nullable: telemetry promoted columns must be nullable"
        "503":
          description: |
            Tenant DuckLake registry/scope unavailable or schema apply/record
            failed. Possible `error.code` values:
            `ducklake_connection_unavailable`, `ducklake_scope_unavailable`,
            `promotion_schema_apply_failed`, `promotion_spec_record_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionErrorResponse"
              examples:
                registryUnavailable:
                  value:
                    error:
                      code: ducklake_connection_unavailable
                      message: tenant DuckLake resolver is unavailable
                schemaApplyFailed:
                  value:
                    error:
                      code: promotion_schema_apply_failed
                      message: "DuckLake DDL failed: ..."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    IngestUnavailable:
      description: DuckLake commit failed after backend retries; exporter should retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestResponse"
          example:
            success: false
            ingested_count: 0
            message: "Ingestion failed: DuckLake write failed"
  schemas:
    IngestResponse:
      type: object
      required:
        - success
        - ingested_count
        - message
      properties:
        success:
          type: boolean
          description: True when ingestion processing succeeded.
        ingested_count:
          type: integer
          minimum: 0
          description: Number of telemetry records successfully ingested.
        message:
          type: string
          description: Human-readable result details.
      examples:
        traces:
          value:
            success: true
            ingested_count: 128
            message: Successfully ingested 128 spans
    ErrorMessage:
      type: string
      description: Plain-text error body returned for malformed requests.
    ExportTraceServiceRequest:
      type: object
      description: |
        OTLP trace export request (JSON mapping).
        See OpenTelemetry protocol spec for the canonical schema.
      additionalProperties: true
    ExportLogsServiceRequest:
      type: object
      description: |
        OTLP logs export request (JSON mapping).
        See OpenTelemetry protocol spec for the canonical schema.
      additionalProperties: true
    ExportMetricsServiceRequest:
      type: object
      description: |
        OTLP metrics export request (JSON mapping).
        See OpenTelemetry protocol spec for the canonical schema.
      additionalProperties: true
    CreateScoreRequest:
      type: object
      required:
        - score_id
        - timestamp
        - name
        - data_type
        - source
      description: |
        At least one target ID and exactly one value matching `data_type` are
        required. Tenant identity is intentionally absent.
      properties:
        score_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
        span_id:
          type: string
        session_id:
          type: string
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        numeric_value:
          type: number
        string_value:
          type: string
        boolean_value:
          type: boolean
        source:
          type: string
          enum: [api, user, evaluator, annotation]
        comment:
          type: string
        config_id:
          type: string
        author_id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    Score:
      allOf:
        - $ref: "#/components/schemas/CreateScoreRequest"
        - type: object
          required:
            - record_date
          properties:
            record_date:
              type: string
              format: date
    CreateScoreConfigRequest:
      type: object
      required:
        - config_id
        - timestamp
        - name
        - data_type
      description: |
        Append-only score schema used to validate scores that carry `config_id`.
        Tenant identity is intentionally absent.
      properties:
        config_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
        data_type:
          type: string
          enum: [numeric, categorical, boolean, text]
        description:
          type: string
          nullable: true
        min_value:
          type: number
          format: double
          nullable: true
        max_value:
          type: number
          format: double
          nullable: true
        categories:
          type: array
          items:
            type: string
          default: []
        author_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          default: {}
    ScoreConfig:
      allOf:
        - $ref: "#/components/schemas/CreateScoreConfigRequest"
        - type: object
          required:
            - record_date
          properties:
            record_date:
              type: string
              format: date
    ScoreConfigListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScoreConfig"
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ObservationSearchRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        observation_types:
          type: array
          items:
            type: string
            enum: [span, event, generation, agent, tool, chain, retriever, evaluator, embedding, guardrail]
        model_name:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        trace_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
    ObservationSummary:
      type: object
      required: [trace_id, span_id, name, observation_type, start_time]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        session_id: { type: string }
        name: { type: string }
        observation_type: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status_code: { type: string }
        model_name: { type: string }
        model_provider: { type: string }
        user_id: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
    ObservationSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationSummary"
        next_cursor:
          type: string
    ObservationDetail:
      allOf:
        - $ref: "#/components/schemas/ObservationSummary"
        - type: object
          properties:
            attributes:
              type: object
              additionalProperties:
                type: string
            events:
              type: array
              items:
                type: object
            scores:
              type: array
              items:
                $ref: "#/components/schemas/Score"
    TraceSummary:
      type: object
      required: [trace_id, start_time, end_time, observation_count]
      properties:
        trace_id: { type: string }
        session_id: { type: string }
        name: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        observation_count: { type: integer }
        error_count: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
        user_id: { type: string }
    TraceDetail:
      type: object
      required: [trace, observations, scores]
      properties:
        trace:
          $ref: "#/components/schemas/TraceSummary"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationDetail"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        next_cursor:
          type: string
    SessionDetail:
      type: object
      required: [session_id, from, to, trace_count, observation_count, traces, scores]
      properties:
        session_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        trace_count: { type: integer }
        observation_count: { type: integer }
        user_ids:
          type: array
          items:
            type: string
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        total_cost: { type: number }
        traces:
          type: array
          items:
            $ref: "#/components/schemas/TraceSummary"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        next_cursor:
          type: string
    PromotionApplyRequest:
      type: object
      required:
        - manifestYaml
      properties:
        manifestYaml:
          type: string
          description: |
            YAML document with `specVersion: softprobe.promotion.v1`.
            See `docs/promotion.md` for the full manifest contract.
    PromotionApplyResponse:
      type: object
      required:
        - specVersion
        - applied
        - target
        - schemaChanges
      properties:
        specVersion:
          type: string
          const: softprobe.promotion.apply.v1
        applied:
          type: boolean
        target:
          type: object
          additionalProperties: true
          description: Applied target summary (`telemetry_columns` or `business_table`).
        schemaChanges:
          type: array
          items:
            type: object
            additionalProperties: true
    PromotionErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
