version: compat.v0
otlp_write_canonical: true
protocols:
  prometheus:
    base_path: /api/v1
    write_apis: false
    endpoints:
      - method: [GET, POST]
        path: /api/v1/query
        status: phase_1
      - method: [GET, POST]
        path: /api/v1/query_range
        status: phase_1
      - method: [GET]
        path: /api/v1/labels
        status: supported
      - method: [GET]
        path: /api/v1/label/{name}/values
        status: supported
      - method: [GET]
        path: /api/v1/series
        status: supported
      - method: [GET]
        path: /api/v1/metadata
        status: supported
    language_features:
      promql: subset_phase_1
      promql_supported:
        - vector_selectors
        - label_matchers
        - instant_and_range_vectors
        - aggregations_sum_min_max_avg_count_by_without
        - aggregations_topk_bottomk
        - arithmetic_and_comparison
        - set_operators_and_or_unless
        - rate_irate_increase
        - delta_idelta
        - over_time_sum_avg_min_max_count_last
        - math_abs_ceil_floor_round
        - offset_modifier
      promql_unsupported:
        - native_histogram_functions
        - subqueries
        - at_modifier
        - on_ignoring_matching
        - group_left_group_right
        - summary_quantile_series_expansion
        - full_function_catalog
        - recording_rules_alerts
  loki:
    base_path: /loki/api/v1
    write_apis: false
    endpoints:
      - method: [GET]
        path: /loki/api/v1/query
        status: stub
      - method: [GET]
        path: /loki/api/v1/query_range
        status: stub
      - method: [GET]
        path: /loki/api/v1/labels
        status: stub
      - method: [GET]
        path: /loki/api/v1/label/{name}/values
        status: stub
      - method: [GET]
        path: /loki/api/v1/series
        status: stub
    language_features:
      logql: subset_pending_phase_2
  tempo:
    write_apis: false
    endpoints:
      - method: [GET]
        path: /api/traces/{traceID}
        status: stub
      - method: [GET]
        path: /api/v2/traces/{traceID}
        status: stub
      - method: [GET]
        path: /api/search
        status: stub
      - method: [GET]
        path: /api/search/tags
        status: stub
      - method: [GET]
        path: /api/search/tag/{tag}/values
        status: stub
    language_features:
      traceql: subset_pending_phase_3
  grafana:
    native_datasources: pending_phase_4
    custom_plugin: out_of_scope
storage_fidelity:
  classic_histogram: preserved
  summary: preserved
  exponential_histogram: unsupported_feature
  span_links: phase_3_gap  # tracked: https://github.com/softprobe/thelake/issues/33
  instrumentation_scope_columns: phase_3_gap  # tracked: https://github.com/softprobe/thelake/issues/33
errors:
  unsupported_feature:
    code: unsupported_feature
    http_status: 501
  unauthorized:
    http_status: 401
  forbidden:
    http_status: 403
limits:
  max_query_range_seconds: 86400
  max_series: 10000
  max_response_bytes: 16777216
  max_labels_per_series: 40
  query_timeout_seconds: 30
auth:
  bearer: softprobe_api_key
  loki_scope_header: X-Scope-OrgID
  tempo_scope_header: X-Scope-OrgID
  scope_header_must_match_tenant: true
