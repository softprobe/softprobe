# Local S3/MinIO DuckLake smoke config.
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY

server:
  port: 8090
  host: "0.0.0.0"
  max_body_size: 104857600
  worker_threads: null

object_store:
  region: "us-east-1"
  endpoint: null

query:
  max_connections: 10
  cache_dir: "/tmp/datalake-local-test/cache"

maintenance:
  enabled: false
  target_file_size_bytes: 67108864
  interval_seconds: 3600

ducklake:
  catalog_type: "sqlite"
  metadata_path: "/tmp/datalake-local-test/metadata.sqlite"
  data_path: "s3://YOUR-BUCKET/ducklake/"
  catalog_alias: "softprobe"
  metadata_schema: "main"
  data_inlining_row_limit: 10000
  writer_pool_size: 4
