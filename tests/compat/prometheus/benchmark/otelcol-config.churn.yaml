# Host metrics → Softprobe with aggressive flush (small-file stress).
# Used when BENCH_FORCE_PARQUET=1 (compose override).

receivers:
  hostmetrics:
    collection_interval: 1s
    scrapers:
      cpu:
      memory:
      load:
      network:

processors:
  resource:
    attributes:
      - key: service.name
        value: prom-bench-host
        action: upsert
  batch:
    # Keep batches tiny so DuckLake cannot absorb them via inlining alone
    # when data_inlining_row_limit is 0.
    send_batch_size: 8
    timeout: 1s

exporters:
  otlphttp/softprobe:
    endpoint: http://host.docker.internal:8090
    tls:
      insecure: true
    headers:
      Authorization: "Bearer local-dev-key"
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resource, batch]
      exporters: [otlphttp/softprobe, debug]
