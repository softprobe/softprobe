# Cloudflare R2 object store for DuckLake data_path (S3-compatible).
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (R2 API token).
# Set ducklake.data_path to s3://<bucket>/ducklake/ or pass R2_BUCKET to Make targets.

server:
  port: 8090
  host: 127.0.0.1
  max_body_size: 104857600
  worker_threads: null

object_store:
  region: auto
  endpoint: https://YOUR-ACCOUNT-ID.r2.cloudflarestorage.com

query:
  max_connections: 10
  cache_dir: /var/tmp/softprobe/duckdb

maintenance:
  enabled: false
  target_file_size_bytes: 67108864
  interval_seconds: 3600

ducklake:
  catalog_type: sqlite
  metadata_path: /tmp/splake-r2-ducklake/metadata.sqlite
  data_path: s3://YOUR-R2-BUCKET/ducklake/
  catalog_alias: softprobe
  metadata_schema: main
  data_inlining_row_limit: 10000
  writer_pool_size: 4
