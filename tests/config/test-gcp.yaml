# GCS DuckLake stress / local-against-GCS smoke.
# Prefer tests/config/test-gcs.yaml for e2e. This file remains for `make stress BACKEND=gcs`.
#
# Requires: GCS_HMAC_ACCESS_KEY_ID / GCS_HMAC_SECRET and a real GCS_BUCKET.

server:
  port: 8090
  host: 127.0.0.1
  max_body_size: 104857600
  worker_threads: null

object_store:
  region: us-central1

query:
  max_connections: 10
  cache_dir: /var/tmp/softprobe/duckdb

maintenance:
  enabled: true
  target_file_size_bytes: 67108864
  interval_seconds: 3600

ducklake:
  catalog_type: sqlite
  metadata_path: /tmp/splake-gcs-ducklake/metadata.sqlite
  data_path: gs://softprobe-datalake-ducklake/ducklake/
  catalog_alias: softprobe
  metadata_schema: main
  data_inlining_row_limit: 10000
  writer_pool_size: 4
